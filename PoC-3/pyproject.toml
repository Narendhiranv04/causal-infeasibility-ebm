[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poc3"
version = "0.0.0"
description = "PoC-3: learned intervention energy for minimal corrective recourse (imports frozen PoC-1 `poc` and PoC-2 `poc2`)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "mujoco==3.10.0",  # same validated version as PoC-1 / PoC-2, whose oracle PoC-3 reuses for labels
]

[project.optional-dependencies]
dev = ["pytest"]
plot = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../PoC-2/src", "../PoC-1/src"]  # PoC-1 and PoC-2 are imported, never copied
