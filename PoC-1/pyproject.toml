[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poc"
version = "0.0.0"
description = "PoC: intervention-grounded infeasibility + structured repair"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "mujoco==3.10.0",  # Stage 4 oracle; signed-distance semantics validated on this version
]

[project.optional-dependencies]
dev = ["pytest"]
plot = ["matplotlib"]  # optional geometry-inspection plots written by scripts/

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
